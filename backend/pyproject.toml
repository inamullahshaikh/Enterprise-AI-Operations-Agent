[project]
name = "relay"
version = "0.1.0"
description = "Relay — Enterprise AI Operations Agent (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "email-validator>=2.2",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=1.0",
  "google-genai>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "tenacity>=8.5",
  "mcp>=1.0",
  "openapi-pydantic>=0.4",
  "jsonschema>=4.23",
  "sqlglot>=25.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "boto3>=1.35",
  "httpx>=0.27",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "testcontainers>=4.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relay_core*", "relay_api*", "relay_worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI relies on `Depends(...)`/`Path(...)`/`Query(...)` etc. as argument
# defaults; B008 doesn't know these are meant to be evaluated once at import
# time, so they're marked immutable rather than triggering on every route.
# `require_workspace_role(...)` (relay_api/deps.py) is the same pattern: a
# parameterized dependency factory called once per route definition, not per
# request.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Security",
  "relay_api.deps.require_workspace_role",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# docs/system-design.md section 10.3.
#
# Phase 7 B1 points this at the real Gmail REST API: `base_url` is https://gmail.googleapis.com
# in production and the mock service (section 21.2) in dev and eval runs. The paths and shapes
# are identical either way, so nothing in the connector changes between them — only the base URL
# and the token, which the connector OAuth flow writes.
key: gmail
display_name: Gmail
category: email
description: Search and read email, compose drafts, and send them once a human approves.
auth_type: oauth2
config_schema:
  type: object
  required: [base_url]
  properties:
    base_url:
      type: string
      description: Mailbox API base URL. Use the mock service in dev/eval runs.
      default: http://mock-services:8100
    sender_address:
      type: string
      format: email
      description: >-
        Which mailbox this installation is connected to. Metadata only, since the API always
        drafts as the authorized account.
secrets_schema:
  type: object
  properties:
    access_token:
      type: string
      description: OAuth2 access token. Written by the connector OAuth flow.
    refresh_token:
      type: string
      description: OAuth2 refresh token. Written by the connector OAuth flow.
provides_capabilities:
  - email.read
  - email.draft
  - email.send
docs_url: https://developers.google.com/gmail/api

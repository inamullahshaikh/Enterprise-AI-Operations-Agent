# docs/system-design.md section 6.4. Declares no capabilities: an MCP server's tools are only
# known once discovered, and each one is tagged (or assigned by an admin) per tool.
key: mcp
display_name: MCP server
category: generic
description: Connect any remote MCP server over streamable HTTP and use its tools.
auth_type: api_key
config_schema:
  type: object
  required: [url]
  properties:
    url:
      type: string
      description: The server's streamable HTTP endpoint, e.g. https://tickets.example.com/mcp
    timeout_s:
      type: number
      minimum: 1
      maximum: 120
      default: 30
secrets_schema:
  type: object
  properties:
    token:
      type: string
      description: "Static bearer token, sent as an Authorization: Bearer header."
provides_capabilities: []

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-db: # the "customer company" database the agent queries
    image: postgres:16
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports: ["5433:5432"]
    volumes: ["./demo/seed:/docker-entrypoint-initdb.d"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # Object storage is Cloudflare R2 (S3-compatible API) in every environment, including
  # local dev — there is no local storage container. See R2_* in .env.example and
  # docs/adr/0005-cloudflare-r2-object-storage.md.

  api:
    # Build context is the repo root, not ./backend: the image also installs
    # evals/relay_eval (docs/system-design.md section 21), which needs relay_core/relay_api
    # importable and so can't be built from a context that excludes them. See backend/Dockerfile.
    build: { context: ., dockerfile: backend/Dockerfile }
    command: uvicorn relay_api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    # demo/documents is read by `make seed` (relay_worker.tasks.maintenance.seed_demo, run
    # inside this container) to ingest the sample knowledge base — everything else in demo/ is
    # only needed by demo-db above.
    volumes: ["./backend:/app", "./demo/documents:/demo/documents:ro"]

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: celery -A relay_worker.app worker -Q agent,agent_resume,ingest,memory,connectors,eval,maintenance -c 4
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./backend:/app", "./demo/documents:/demo/documents:ro"]

  beat:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: celery -A relay_worker.app beat
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  sandbox:
    build: ./sandbox
    ports: ["8080:8080"]
    networks: [default, sandbox_net]
    environment:
      SANDBOX_RUNTIME_IMAGE: relay-sandbox-runtime:latest
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    # NOTE: dev-only convenience; do not mount the Docker socket in any shared/cloud
    # environment. Socket access here is equivalent to root on the host — this service can
    # launch sibling containers with arbitrary mounts/capabilities. See docs/system-design.md
    # §10.7/§23.1/§23.2 for the isolated-host design a real deployment needs instead
    # (a managed sandbox provider, or Docker-outside-of-Docker with gVisor/Kata on a host with
    # no other sensitive workloads).

  mock-services: # fake HubSpot/Gmail/Calendar/Search for dev & evals
    build: ./mocks
    ports: ["8100:8100"]

  mcp-ticketing: # sample MCP server for the bring-your-own-tools demo (mcp_examples/)
    build: ./mcp_examples/ticketing
    ports: ["8200:8200"]

  web:
    build: ./frontend
    env_file: .env
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]

volumes:
  pgdata: {}

networks:
  sandbox_net:
    internal: true
